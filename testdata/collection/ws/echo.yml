info:
  name: WebSocket echo
  type: websocket
  seq: 1
websocket:
  url: ws://{{httpHost}}/ws
extensions:
  streamx:
    messages:
      - '{"n": 1}'
      - '{"n": 10}'
    stream:
      maxMessages: 2
    # OpenCollection has no assertions on WebSocket requests, so they live here.
    assertions:
      - expression: res.messages[0].n
        operator: eq
        value: "2"
      - expression: res.messages[1].n
        operator: eq
        value: "11"
