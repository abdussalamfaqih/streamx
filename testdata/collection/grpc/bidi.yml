info:
  name: bidi streaming
  type: grpc
  seq: 5
grpc:
  url: grpc://{{host}}
  method: streamx.test.Echo/Bidi
  methodType: bidi-streaming
  protoFilePath: ../protos/echo.proto
runtime:
  assertions:
    - expression: res.messages.length
      operator: eq
      value: "2"
    - expression: res.messages[1].n
      operator: eq
      value: "6"
extensions:
  streamx:
    messages:
      - '{"text": "a"}'
      - '{"text": "b", "n": 5}'
