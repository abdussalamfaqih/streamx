info:
  name: unary via reflection
  type: grpc
  seq: 1
grpc:
  url: grpc://{{host}}
  method: streamx.test.Echo/Unary
  methodType: unary
  metadata:
    - name: x-suffix
      value: "!"
  message: |-
    {"text": "hi", "n": 1}
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "0"
    - expression: res.body.text
      operator: eq
      value: hi!
    - expression: res.headers.x-served-by
      operator: eq
      value: testserver
extensions:
  streamx:
    # gRPC has no runtime.actions in OpenCollection, so capture lives here.
    actions:
      - type: set-variable
        phase: after-response
        selector:
          expression: res.body.text
          method: jsonq
        variable:
          name: echoed
          scope: runtime
