info:
  name: server streaming, stop after 3
  type: grpc
  seq: 3
grpc:
  url: grpc://{{host}}
  method: streamx.test.Echo/ServerStream
  methodType: server-streaming
  message: |-
    {"text": "s", "count": 5}
runtime:
  assertions:
    - expression: res.messages.length
      operator: eq
      value: "3"
    - expression: res.messages[*].text
      operator: eq
      value: s
extensions:
  streamx:
    stream:
      maxMessages: 3
