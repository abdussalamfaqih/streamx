name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - if: matrix.os == 'ubuntu-latest'
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      - if: matrix.os == 'ubuntu-latest'
        name: cyclomatic complexity under 10
        run: go run github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0 -over 9 -ignore _test .
